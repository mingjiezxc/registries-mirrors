# rms 配置 — 192.168.188.103(公共容器环境)
#
# 与仓库根目录的 config/rms.yaml 的差别:
#   1. namespace 更多(10 个,含 daocloud 镜像与 k8s.gcr.io 别名),且**官方上游优先、
#      daocloud 镜像兜底** —— 顺序由 103 现场实测决定:最初配成镜像优先时,决策行显示
#      ghcr.io/gcr.io 恒为 unreachable:upstream-status(镜像回 5xx),而 /v2/ 探活正常。
#      逐条理由见各 namespace 的注释与 ../reports/103-selection-rollout.md 的「两处刻意偏离」;
#   2. 上游出网走局域网代理 RMS_UPSTREAM_PROXY(见 .env),不是直连。
#   3. **auth.type: none(2026-10-14)** —— 拉和推都不再要密码,见 auth 段的理由、代价与收回办法。
#
# 已删除的旧形态(2026-10-13):
#   - namespaces.default:无限定请求不再改写成一个固定仓库,改为并发探测所有
#     proxy namespace、挑真有该镜像且最快的一个;
#   - listeners 与 anonymous_root:按 namespace 绑定的独立端口
#     整体下线,只剩主端点 5000 与指标 9100。
#
# 每个值都支持 ${VAR} / ${VAR:-default};引用未定义且无默认值的变量会让启动失败。

server:
  # 主端点:多 namespace,路径里写 namespace,也是推送入口。
  #   docker pull 192.168.188.103:5000/docker.io/library/alpine
  #   docker push 192.168.188.103:5000/<user>/app:v1
  listen: "0.0.0.0:5000"
  # 直连访问,留空表示按请求推导来源(上传 URL 用)。
  external_url: "${RMS_EXTERNAL_URL:-}"
  http_secret: "${RMS_HTTP_SECRET:-}"
  behind_proxy: false
  graceful_shutdown: 20s

storage:
  root: "${RMS_STORAGE_ROOT:-/data}"
  delete_enabled: true
  upload_purge:
    enabled: true
    age: 168h
    interval: 24h

auth:
  # 2026-10-14:由 htpasswd 改成 none —— **拉和推都不再要密码**(与 172 同一天、同因)。
  #
  # 为什么:Basic 方案下 /v2/ 必须回 401 挑战(`docker login` 靠它验密码、后续 push 靠它
  # 带上凭据),而 classic dockerd 拿到 Basic 挑战后就不再发匿名内容请求 —— 显式主机名
  # 匿名 pull 直接 `no basic auth credentials`(实测:rms 侧来自该 dockerd 的请求数 = 0);
  # anonymous_pull_proxy/local 只作用于内容路径,救不了。完整实测过程见
  # deploy/172/README.md 的「2026-10-14 变更」,103 是同一份代码。
  #
  # ⚠️ 代价:type: none = 完全开放。任何能连到 rms.majorc.eu.org / 192.168.188.103:5000 的人
  #   (局域网 + tailnet;公网 DNS 里 rms 指向 192.168.188.11,外部不可路由)都可以:
  #     push 任意 tag 到 me / shared、DELETE 它们的 manifest 与 blob(storage.delete_enabled: true)、
  #     匿名读 /v2/_catalog。proxy namespace 的写仍是 403(那是 namespace 属性,与鉴权开关无关)。
  #   启动日志会打一条 `WARN authentication is disabled...`,`rms config validate` 会打
  #   `auth: none: PUSHES ARE UNPROTECTED`。收回办法与改动前备份见
  #   deploy/103/README.md 的「2026-10-14:取消认证(auth.type: none)」。
  type: none
  htpasswd: "${RMS_HTPASSWD:-/etc/rms/htpasswd}"
  realm: rms
  # 下面几项在 type: none 时不参与任何判定(Authenticator 直接放行),保留是为了切回 htpasswd
  # 时行为与 2026-10-14 之前一致:
  #   * user_namespace 必须是 false —— Validate 拒绝 `user_namespace: true` + `type: none`;
  #   * me / shared 由 shared_namespaces 定义,仍是可写本地 namespace(发布镜像 `me/rms` 走这里);
  #     htpasswd 里 alice/bob/carol 的同名 namespace 不再派生(那三个本来就没有内容)。
  user_namespace: false
  shared_namespaces: [me, shared]
  # 代理 namespace 是公共缓存,匿名可读;本地 namespace 在 type: none 下也一并放开
  # (anonymous_pull_local 同上:现在不参与判定,保留 false 是为了回滚后仍是「本地 namespace
  # 读也要登录」的旧形态)。
  anonymous_pull_proxy: true
  anonymous_pull_local: false
  admin_users: [admin]

namespaces:
  # 无限定请求(路径里没有 namespace)由这里决定怎么挑:并发探测下面所有 proxy
  # namespace,取真的有该仓库、响应最快的那个。旧配置里的 default: docker.io
  # 已彻底删除 —— 写一个固定仓库既漏(ghcr.io 的镜像永远拉不到),又慢(绑死一条路)。
  selection:
    # 同 (仓库, tag/digest) 的决策复用多久再重新探测;也是「仓库亲和」窗口:
    # blob 请求路径里没有仓库名,它复用同仓库 manifest 的决策,随这个 TTL 一起过期。
    probe_ttl: 30s
    # 单个候选探测的上限,同时也是未命中缓存时请求等待决策的上限。
    # 与 upstream.health.timeout 同量级:走代理时 quay.io/registry.k8s.io 实测 4-5s。
    probe_timeout: 10s
    # 软截止:第一个探测答出后再等 3s 就用已有结果决策,未答的候选记为 skipped。
    # 10 个 namespace × 各自上游并发时,一个卡住的镜像站不该让冷请求等满 probe_timeout。
    decision_deadline: 3s
    # 均衡:digest 一致、且延迟在 balance_window 倍以内的上游按 1/延迟加权轮询。
    balance: weighted
    balance_window: 1.5

  proxy:
    docker.io:
      # 顺序即优先级:第一个探活成功的当选,连续失败自动切到下一个。
      #
      # 2026-10-12 在 .103 上的实测(同一个 2.2MB layer):
      #   daocloud 直连      295 KB/s(小 blob 行,但见下)
      #   1ms 直连            12 KB/s,90s 未传完
      #   1ms 走局域网代理    168 KB/s,完整
      #   官方 Hub 直连       连不上(000)
      #   官方 Hub 走代理     13.7 KB/s,90s 未传完
      #
      # 而 daocloud 在大 blob 上会挂:它把 blob 302 到
      # image-mirror.r2.daocloud.vip(Cloudflare R2),rms 侧那条 HTTP/2 请求
      # 「timeout awaiting response headers」卡满 60s 才失败(日志原文见
      # ../../../reports/103-rms-deploy.md),客户端只能靠 docker 反复重试,
      # 实测一次 3MB 的 alpine 拉取要 4 分钟。daocloud 的 token 又绑客户端 IP,
      # 一旦走代理就直接 401,所以它跟下面的 proxy 设置互斥 —— 干脆不用它。
      #
      # 于是:1ms 优先(经代理稳定可用),官方 Hub 兜底。官方直连不可达、
      # 经代理也很慢,但作为最后一道仍然好过没有。
      #
      # 2026-10-13 增补:按人的要求补上 docker.m.daocloud.io,但**排在最后**。
      # 理由就是上面那段实测:daocloud 的失败形态是「/v2/ 探活正常、取内容失败」
      # (blob 302 到 R2 后挂满 60s;token 绑客户端 IP,走代理直接 401),而
      # upstream 选举只看 /v2/ 探活 —— 把它放第一位会在探活健康的情况下拿不到层。
      # 今天复测:docker.m.daocloud.io 的 /v2/ 回 401、0.17s(与其余八个 daocloud
      # 镜像一样快),所以它作为**第二道**是可用的;若要改成第一位,把下面两行
      # 对调即可(代价见上)。
      upstreams:
        - "https://docker.1ms.run"
        - "https://registry-1.docker.io"
        - "https://docker.m.daocloud.io"
      # 与 Docker Hub 一致:单段仓库名注入 library/。
      official_library: true
      # 0 = 不过期,同时不安装 distribution 的 TTL 调度器(上游切换重建引擎时
      # 两个调度器会争用同一份 scheduler-state.json)。
      ttl: 0

    ghcr.io:
      # 2026-10-13:官方优先、daocloud 镜像兜底(**顺序与最初设想相反**,理由如下)。
      # 最初按镜像优先配成 ["ghcr.m.daocloud.io", "https://ghcr.io"],但 103 上线后
      # 决策日志显示这两个 namespace 恒为 unreachable:upstream-status —— 即镜像
      # 对这些路径回 5xx。/v2/ 探活正常不代表能取内容(同 docker.io 那段记录的
      # daocloud 失败形态)。因此改成官方在前,镜像只在官方失败时接手。
      upstreams: ["https://ghcr.io", "https://ghcr.m.daocloud.io"]

    gcr.io:
      upstreams: ["https://gcr.io", "https://gcr.m.daocloud.io"]

    quay.io:
      upstreams: ["https://quay.io", "https://quay.m.daocloud.io"]

    registry.k8s.io:
      upstreams: ["https://registry.k8s.io", "https://k8s.m.daocloud.io"]

    # --- 2026-10-13 新增(按人的表格)--------------------------------------
    # 左侧是客户端写的 namespace,右侧是实际代理的上游。全部实测可达:
    # 九个 daocloud 镜像的 /v2/ 都在 0.17-0.21s 内回 401(见
    # reports/raw/daocloud-mirrors-probe.txt)。
    docker.elastic.co:
      upstreams: ["https://docker.elastic.co","https://elastic.m.daocloud.io"]

    dhi.io:
      upstreams: ["https://dhi.io","https://dhi.m.daocloud.io"]

    k8s.gcr.io:
      # k8s.gcr.io 是废弃名,官方已迁到 registry.k8s.io —— 这里不是 daocloud
      # 镜像,而是把旧名映射到官方新域名,让老镜像名继续可用。
      upstreams: ["https://registry.k8s.io"]

    mcr.microsoft.com:
      upstreams: ["https://mcr.microsoft.com","https://mcr.m.daocloud.io"]

    nvcr.io:
      upstreams: ["https://nvcr.io","https://nvcr.m.daocloud.io"]

# listeners 整段删除:那些按 namespace 绑定的端口已下线,连同
# anonymous_root 一起不再存在。只剩主端点 5000(见 server.listen)与指标 9100
# (见 observability.metrics.listen)。迁移口径见 deploy/103/README.md。

upstream:
  health:
    enabled: true
    interval: 30s
    timeout: 10s
    fail_threshold: 2
    success_threshold: 1
    path: /v2/

  http:
    # 走局域网代理。实测:1ms 直连只有 12 KB/s 且传不完,经这个代理 168 KB/s
    # 完整;官方 Hub 直连直接不可达。旧的 registry:2 栈在 .103 上也是给
    # reg-docker/reg-ghcr/reg-gcr/reg-k8s/reg-quay 配了同一个代理。
    proxy: "${RMS_UPSTREAM_PROXY:-}"
    # 回环、局域网与 SASE 可达的公司网段绝不能走代理。
    no_proxy: "${RMS_NO_PROXY:-localhost,127.0.0.1,192.168.188.0/24,10.82.0.0/16,10.44.0.0/16}"
    dial_timeout: 10s
    response_header_timeout: 60s
    tls_handshake_timeout: 10s
    idle_conn_timeout: 90s
    insecure_skip_verify: false

observability:
  logs:
    level: info
    format: json
  traces:
    # SigNoz/OTLP 接收端就在本机(grafana-otel-lgtm,宿主 4317)。
    enabled: true
    endpoint: "192.168.188.103:4317"
    insecure: true
    sample_ratio: 0.2
  metrics:
    listen: "0.0.0.0:9100"
    path: /metrics
  pprof: false
