# rms 配置 — 10.82.64.172（公司内网，/app/rms）
#
# 这台机器有两个身份:
#   1. 唯一的可写私仓 `ops`（namespaces.local）—— docker push 10.82.64.172:5000/ops/<镜像>;
#   2. 下面 10 个上游的镜像缓存 —— 路径里带 namespace 直连该 namespace,不带 namespace 则由
#      rms 并发探测所有 proxy namespace、挑真有该镜像且最快的那个。
#
# 相对仓库里 deploy/103/rms.yaml 的差别:
#   * 出网走公司代理 10.82.44.12:8080（见 .env 的 RMS_UPSTREAM_PROXY）;
#   * 只有私仓 ops:user_namespace 关掉、shared_namespaces 清空,不留 me/shared;
#   * **auth.type: none（2026-10-14）** —— 拉和推都不再要密码,见 auth 段的理由与代价;
#   * anonymous_pull_proxy: true —— 镜像缓存匿名可拉（要当 dockerd 的 registry-mirrors 用就必须
#     这样，见 auth 段）;
#   * traces 关掉（本机没有 collector）。
#
# 每个值都支持 ${VAR} / ${VAR:-default};引用未定义且无默认值的变量会让启动失败。

server:
  # 主端点。容器内是 5000,宿主也映射到 5000（2026-10-14 由 5003 改来,见 .env 的
  # RMS_PORT_PRIMARY；原先的 registry:2 栈已退役,见 compose.yaml）。
  #   docker pull 10.82.64.172:5000/prom/node-exporter          # 无限定名,由 rms 选 namespace
  #   docker pull 10.82.64.172:5000/docker.io/library/alpine
  #   docker push 10.82.64.172:5000/ops/<镜像>
  listen: "0.0.0.0:5000"
  # 直连访问,留空表示按请求推导来源(上传 URL 用)。
  external_url: "${RMS_EXTERNAL_URL:-}"
  http_secret: "${RMS_HTTP_SECRET:-}"
  behind_proxy: true
  graceful_shutdown: 20s

storage:
  root: "${RMS_STORAGE_ROOT:-/data}"
  delete_enabled: true
  upload_purge:
    enabled: true
    age: 168h
    interval: 24h

auth:
  # 2026-10-14：由 htpasswd 改成 none —— 这台机器只在内网,运维要的是「pull 免密」,
  # 而 Basic 方案下 classic dockerd（27.x/28.x，overlay2）做不到「匿名 pull + push 要密码」
  # 这个组合,见下面三条实测（完整读数在 deploy/172/README.md「2026-10-14 变更」）：
  #   1. htpasswd + Basic 时 /v2/ 必然回 401 + WWW-Authenticate: Basic；classic dockerd
  #      拿到挑战后就不再发匿名内容请求 → 显式主机名的匿名 pull 报
  #      `no basic auth credentials`，anonymous_pull_proxy/local 只作用于内容路径，救不了。
  #   2. 试过「/v2/ 对无凭据请求回 200」的开关：匿名 pull 能用了，但 classic dockerd 的
  #      push 彻底失效（凭据正确也 `unauthorized`，它不会在 401 后用已保存的凭据重试）。
  #   3. containerd 系客户端（docker 29 + containerd 镜像存储 / nerdctl / ctr）本来就能
  #      匿名 pull，但要照顾的恰恰是 classic 客户端。
  # ⚠️ 代价：type: none = 完全开放。任何能连到 10.82.64.172:5000 的人都可以 push、
  #    DELETE `ops` 的镜像（storage.delete_enabled: true），也能匿名读 /v2/_catalog；
  #    proxy namespace 的写仍然是 403（那是 namespace 属性,与鉴权开关无关）。
  #    要收回：把 type 改回 htpasswd（htpasswd 文件仍在 /app/rms/config/htpasswd）
  #    并 `docker compose up -d --force-recreate`；改动前的备份是
  #    /app/rms/config/rms.yaml.bak-<时间戳>。
  type: none
  htpasswd: "${RMS_HTPASSWD:-/etc/rms/htpasswd}"
  realm: rms
  # 下面几项在 type: none 时不参与任何判定（Authenticator 直接放行），保留是为了
  # 切回 htpasswd 时不用重写；anonymous_pull_local: true 是 2026-10-14 之前那版
  # htpasswd 配置的遗留值。
  user_namespace: false
  shared_namespaces: []
  # 代理 namespace(镜像缓存)匿名可读:各客户端的 dockerd 是匿名的,不这样它会把本机当
  # 「需要登录的镜像源」直接跳过(见 `rms config validate` 的 pull: 那一行)。
  anonymous_pull_proxy: true
  anonymous_pull_local: true
  admin_users: [admin]

namespaces:
  # 唯一的可写私仓。推送地址:10.82.64.172:5000/ops/<镜像>
  local: [ops]

  # 无限定请求(路径里没有 namespace)由这里决定怎么挑:并发探测下面所有 proxy
  # namespace,取真的有该仓库、响应最快的那个。
  selection:
    # 同 (仓库, tag/digest) 的决策复用多久再重新探测;也是「仓库亲和」窗口:
    # blob 请求路径里没有仓库名,它复用同仓库 manifest 的决策,随这个 TTL 一起过期。
    probe_ttl: 30s
    # 单个候选探测的上限,同时也是未命中缓存时请求等待决策的上限。
    probe_timeout: 10s
    # 软截止:第一个探测答出之后再等 3s 就用已有结果决策,未答的候选记为 skipped。
    # 10 个 namespace × 各自上游并发时,一个卡住的镜像站不该让冷请求等满 probe_timeout。
    decision_deadline: 3s
    # 均衡:digest 一致、且延迟在 balance_window 倍以内的上游按 1/延迟加权轮询。
    # weighted | round_robin | off
    balance: weighted
    balance_window: 1.5

  proxy:
    docker.io:
      # 顺序 = digest 权威顺序（并发竞争，第一个答出内容的定义该 tag 的 digest）。
      # 官方排第二、daocloud 排最后：镜像站的失败形态是「/v2/ 探活正常、取内容失败」，
      # 而且它一旦先答出，就会成为 digest 权威，和官方不一致的内容会被服务出去。
      upstreams:
        - "https://docker.1ms.run"
        - "https://registry-1.docker.io"
        - "https://docker.m.daocloud.io"
      # 与 Docker Hub 一致:单段仓库名注入 library/。
      official_library: true
      # 0 = 不过期,同时不安装 distribution 的 TTL 调度器(上游切换重建引擎时
      # 两个调度器会争用同一份 scheduler-state.json)。
      ttl: 0

    ghcr.io:
      # 官方在前、daocloud 镜像兜底:镜像站对某些路径回 5xx,而 /v2/ 探活正常,
      # 官方定义 tag 的 digest、镜像站只有与之相同才接手。
      upstreams: ["https://ghcr.io", "https://ghcr.m.daocloud.io"]

    gcr.io:
      upstreams: ["https://gcr.io", "https://gcr.m.daocloud.io"]

    quay.io:
      upstreams: ["https://quay.io", "https://quay.m.daocloud.io"]

    registry.k8s.io:
      upstreams: ["https://registry.k8s.io", "https://k8s.m.daocloud.io"]

    docker.elastic.co:
      # 2026-10-13 实测（从 172 走公司代理 10.82.44.12:8080）：elastic.m.daocloud.io 回
      # 502，官方 docker.elastic.co 回 401（=可达）。所以官方在前、镜像兜底。
      upstreams: ["https://docker.elastic.co", "https://elastic.m.daocloud.io"]

    dhi.io:
      upstreams: ["https://dhi.io", "https://dhi.m.daocloud.io"]

    k8s.gcr.io:
      # k8s.gcr.io 是废弃名,官方已迁到 registry.k8s.io —— 这里不是 daocloud
      # 镜像,而是把旧名映射到官方新域名,让老镜像名继续可用。
      upstreams: ["https://registry.k8s.io"]

    mcr.microsoft.com:
      # 同上：mcr.m.daocloud.io 经公司代理回 502，官方 mcr.microsoft.com 回 200。
      upstreams: ["https://mcr.microsoft.com", "https://mcr.m.daocloud.io"]

    nvcr.io:
      # /readyz 曾把 nvcr.io 列为 degraded（只有 daocloud 一个候选）；补上官方在前。
      upstreams: ["https://nvcr.io", "https://nvcr.m.daocloud.io"]

upstream:
  health:
    enabled: true
    interval: 30s
    timeout: 10s
    fail_threshold: 2
    success_threshold: 1
    path: /v2/

  http:
    # 走公司出网代理(见 .env 的 RMS_UPSTREAM_PROXY)。
    proxy: "${RMS_UPSTREAM_PROXY:-}"
    # 回环、局域网与 SASE 可达的公司网段绝不能走代理。
    no_proxy: "${RMS_NO_PROXY:-localhost,127.0.0.1,was.ink,.was.ink,*.was.ink,10.82.0.0/16,10.44.0.0/16}"
    dial_timeout: 10s
    response_header_timeout: 60s
    tls_handshake_timeout: 10s
    idle_conn_timeout: 90s
    insecure_skip_verify: false

observability:
  logs:
    level: debug
    format: json
  traces:
    # 本机没有 collector(103 那台才接 SigNoz)。
    enabled: false
    endpoint: "192.168.188.103:4317"
    insecure: true
    sample_ratio: 0.2
  metrics:
    listen: "0.0.0.0:9100"
    path: /metrics
  pprof: false
